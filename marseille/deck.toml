[deck]
schema_version = "2.0"
name = "Tarot de Marseille"
identifier = "land.arcana/deck/marseille"
version = "0.3"
metadata_language = "en"
artwork_language = ["fr-1694acad"]

publisher = "Yoav Ben-Dov"
published_date = "2011"
artist = "Nicolas Conver, restored by Yoav Ben-Dov"
packager = "Adam Fidel <adam@arcana.land>"

description = "CBD Tarot de Marseille is a faithful reproduction of the traditional Tarot cards. It is based on the standard deck published in Marseille by Nicolas Conver, 1760"
attribution = "CBD Tarot de Marseille by Dr. Yoav Ben-Dov, www.cbdtarot.com"
license = "CC-BY-NC-SA-3.0"
rights_status = "https://rightsstatements.org/vocab/NoC-NC/1.0/"
redistribution = "full"
derivation = "full"
tags = ["restored", "18th-century", "marseille-type-ii"]

pips = "emblematic"
aspect_ratio = 0.5075

links = [
    { rel = "homepage", url = "https://cbdtarot.com" },
    { rel = "source", url = "https://www.flickr.com/photos/48485995@N00/albums"},
]
related = [
    { rel = "pattern", target = "land.arcana/pattern/tarot-de-marseille" },
]

[deck.origin]
"iptc-dst" = "print"

[deck.content_rating."oars-1.1"]
sex_nudity = "mild"
violence_cartoon = "mild"

[card_backs.designs.default]
reversible = true

[cards]
"major_arcana.00" = { name = "Le Mat", unnumbered = true }
"major_arcana.01" = { name = "Le Bateleur" }
"major_arcana.02" = { name = "La Papesse" }
"major_arcana.03" = { name = "L'Imperatrice" }
"major_arcana.04" = { name = "L'Empereur", number = "IIII" }
"major_arcana.05" = { name = "Le Pape" }
"major_arcana.06" = { name = "L'Amoureux" }
"major_arcana.07" = { name = "Le Chariot" }
"major_arcana.08" = { name = "La Justice" }
"major_arcana.09" = { name = "L'Hermite", number = "VIIII" }
"major_arcana.10" = { name = "La Roue de Fortune" }
"major_arcana.11" = { name = "La Force" }
"major_arcana.12" = { name = "Le Pendu" }
"major_arcana.13" = { unnamed = true }
"major_arcana.14" = { name = "Temperance", number = "XIIII" }
"major_arcana.15" = { name = "Le Diable" }
"major_arcana.16" = { name = "La Maison Dieu" }
"major_arcana.17" = { name = "Le Toille" }
"major_arcana.18" = { name = "La Lune" }
"major_arcana.19" = { name = "Le Soleil", number = "XVIIII" }
"major_arcana.20" = { name = "Le Jugement" }
"major_arcana.21" = { name = "Le Monde" }

[minor_arcana]
name_template = "{rank} de {suit}"

[suits]
wands     = { name = "Baton" }
cups      = { name = "Coupe" }
swords    = { name = "Epee", name_template = "{rank} d'{suit}" }
pentacles = { name = "Deniers" }

[ranks]
page = { name = "Valet" }
knight = { name = "Cavalier" }
queen = { name = "Reyne" }
king = { name = "Roy" }
